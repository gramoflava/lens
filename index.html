<!DOCTYPE html>
<html lang="en" data-accent="lens">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Interactive one-page breakdowns of complex topics">
  <meta property="og:title" content="lens · gramoflava">
  <meta property="og:description" content="Interactive one-page breakdowns of complex topics">
  <meta property="og:url" content="https://lens.gramoflava.xyz">
  <title>lens.gramoflava.xyz</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t === 'light') document.documentElement.classList.add('theme-light');
      else if (t === 'dark') document.documentElement.classList.add('theme-dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Outfit:wght@400;500;600&amp;display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="gramofdesign/gramof.css">
  <link rel="stylesheet" href="lens.css">
  <script defer src="gramofdesign/theme.js"></script>
</head>

<body>

  <div class="theme-wrap">
    <div class="segmented segmented--icon" role="group" aria-label="Color theme" data-theme-switch>
      <button class="segmented__btn" type="button" data-theme="light" aria-label="Light" title="Light" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M6.343 17.657l-1.414 1.414M6.343 6.343L4.929 4.929M17.657 6.343l1.414 -1.414M17.657 17.657l1.414 1.414M12 20v2M12 2v2M20 12h2M2 12h2"></path>
        </svg>
      </button>
      <button class="segmented__btn" type="button" data-theme="auto" aria-label="Auto" title="Auto" aria-pressed="false">
        <span>A</span>
      </button>
      <button class="segmented__btn" type="button" data-theme="dark" aria-label="Dark" title="Dark" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3h.393a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 2.992z"></path>
        </svg>
      </button>
    </div>
  </div>

  <header class="hero">
    <div class="container">
      <span class="tag">lens</span>
      <h1>A closer look at complex things</h1>
      <p class="lede">One topic per page. Interactive maps, charts and numbers, with sources and a check of the arithmetic.</p>
    </div>
  </header>

  <main class="container">
    <!--
      The list builds itself: every *.html in the repo root except index.html.
      Each page supplies its own card through <head>:
        <title>Name · lens</title>
        <meta name="description" content="…">
        <meta name="date" content="YYYY-MM-DD">
        <meta name="keywords" content="tag, tag">
    -->
    <ol class="entries" id="entries" aria-live="polite">
      <li class="state"><span class="tag">loading…</span></li>
    </ol>
  </main>

  <script>
    (function () {
      var REPO = 'gramoflava/lens', BRANCH = 'main', CACHE = 'lens:pages:v1', TTL = 10 * 60 * 1000;
      var list = document.getElementById('entries');

      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function meta(doc, name) {
        var m = doc.querySelector('meta[name="' + name + '"]');
        return m ? m.getAttribute('content').trim() : '';
      }
      function fmtDate(iso) {
        var d = new Date(iso + 'T12:00:00');
        return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      function readCache() {
        try {
          var c = JSON.parse(sessionStorage.getItem(CACHE));
          return c && Date.now() - c.t < TTL ? c.pages : null;
        } catch (e) { return null; }
      }
      function writeCache(pages) {
        try { sessionStorage.setItem(CACHE, JSON.stringify({ t: Date.now(), pages: pages })); } catch (e) { }
      }

      function listFiles() {
        return fetch('https://api.github.com/repos/' + REPO + '/contents/?ref=' + BRANCH, {
          headers: { Accept: 'application/vnd.github+json' }
        }).then(function (r) {
          if (!r.ok) throw new Error('GitHub API ' + r.status);
          return r.json();
        }).then(function (items) {
          return items
            .filter(function (it) { return it.type === 'file' && /\.html$/i.test(it.name) && it.name !== 'index.html'; })
            .map(function (it) { return it.name; });
        });
      }

      function readPage(file) {
        return fetch(file, { cache: 'no-cache' })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
          .then(function (html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var title = (doc.title || file).replace(/\s*·\s*lens\s*$/i, '');
            return {
              file: file,
              title: title,
              desc: meta(doc, 'description'),
              date: meta(doc, 'date'),
              tags: meta(doc, 'keywords').split(',').map(function (s) { return s.trim(); }).filter(Boolean)
            };
          })
          .catch(function () { return { file: file, title: file.replace(/\.html$/i, ''), desc: '', date: '', tags: [] }; });
      }

      function render(pages) {
        if (!pages.length) {
          list.innerHTML = '<li class="state"><span class="tag">no pages yet</span></li>';
          return;
        }
        pages.sort(function (a, b) { return (b.date || '').localeCompare(a.date || '') || a.title.localeCompare(b.title); });
        list.innerHTML = pages.map(function (p) {
          var date = p.date ? '<time datetime="' + esc(p.date) + '">' + esc(fmtDate(p.date)) + '</time>' : '';
          var tags = p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
          return '<li><a class="entry solid" href="' + esc(p.file) + '">' +
            '<span class="entry__meta">' + date + tags + '</span>' +
            '<span class="entry__title">' + esc(p.title) + '</span>' +
            (p.desc ? '<span class="entry__desc">' + esc(p.desc) + '</span>' : '') +
            '</a></li>';
        }).join('');
      }

      function fail() {
        list.innerHTML = '<li class="state">The list did not load. ' +
          '<a href="https://github.com/' + REPO + '">See all pages on GitHub</a>.</li>';
      }

      var cached = readCache();
      if (cached) { render(cached); return; }
      listFiles()
        .then(function (files) { return Promise.all(files.map(readPage)); })
        .then(function (pages) { writeCache(pages); render(pages); })
        .catch(fail);
    })();
  </script>

  <footer class="site-footer">
    <div class="container">
      <a href="https://whois.gramoflava.xyz">gramoflava</a>
      <span>·</span>
      <a href="https://github.com/gramoflava/lens">source</a>
    </div>
  </footer>

</body>

</html>
